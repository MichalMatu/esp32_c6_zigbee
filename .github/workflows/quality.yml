name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-zcl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build host ZCL tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -DGATEWAY_ZCL_HOST_TEST \
            -Imain \
            tests/host/test_gateway_zcl_value.c \
            main/gateway_zcl_value.c \
            -lm \
            -o /tmp/test_gateway_zcl_value
      - name: Run host ZCL tests
        run: /tmp/test_gateway_zcl_value

  host-device-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build device state host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Imain \
            tests/host/test_gateway_device_state.c \
            main/gateway_device_state.c \
            -o /tmp/test_gateway_device_state
      - name: Run device state host tests
        run: /tmp/test_gateway_device_state

  host-reporting-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build reporting policy host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Imain \
            tests/host/test_gateway_reporting_policy.c \
            main/gateway_reporting_policy.c \
            -o /tmp/test_gateway_reporting_policy
      - name: Run reporting policy host tests
        run: /tmp/test_gateway_reporting_policy

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32c6
          command: idf.py build
