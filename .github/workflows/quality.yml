name: Quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  host-zcl:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build host ZCL tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -DGATEWAY_ZCL_HOST_TEST \
            -Imain \
            tests/host/test_gateway_zcl_value.c \
            main/gateway_zcl_value.c \
            -lm \
            -o /tmp/test_gateway_zcl_value
      - name: Run host ZCL tests
        run: /tmp/test_gateway_zcl_value

  host-device-state:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build device state host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Imain \
            tests/host/test_gateway_device_state.c \
            main/gateway_device_state.c \
            -o /tmp/test_gateway_device_state
      - name: Run device state host tests
        run: /tmp/test_gateway_device_state

  host-inputs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build generic input host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Imain \
            tests/host/test_gateway_inputs.c \
            main/gateway_inputs.c \
            -o /tmp/test_gateway_inputs
      - name: Run generic input host tests
        run: /tmp/test_gateway_inputs

  host-zigbee-input:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build Zigbee input adapter host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -DGATEWAY_ZCL_HOST_TEST \
            -Imain \
            tests/host/test_gateway_zigbee_input.c \
            main/gateway_zigbee_input.c \
            main/gateway_zcl_value.c \
            main/gateway_inputs.c \
            -lm \
            -o /tmp/test_gateway_zigbee_input
      - name: Run Zigbee input adapter host tests
        run: /tmp/test_gateway_zigbee_input

  host-link-protocol:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GatewayLink protocol host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Imain \
            tests/host/test_gateway_link_protocol.c \
            main/gateway_link_protocol.c \
            -lm \
            -o /tmp/test_gateway_link_protocol
      - name: Run GatewayLink protocol host tests
        run: /tmp/test_gateway_link_protocol

  host-link-event-adapter:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GatewayLink event adapter host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Imain \
            tests/host/test_gateway_link_event_adapter.c \
            main/gateway_link_event_adapter.c \
            main/gateway_link_protocol.c \
            -lm \
            -o /tmp/test_gateway_link_event_adapter
      - name: Run GatewayLink event adapter host tests
        run: /tmp/test_gateway_link_event_adapter

  host-link-stream:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GatewayLink stream host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Imain \
            tests/host/test_gateway_link_stream.c \
            main/gateway_link_stream.c \
            main/gateway_link_protocol.c \
            -lm \
            -o /tmp/test_gateway_link_stream
      - name: Run GatewayLink stream host tests
        run: /tmp/test_gateway_link_stream

  host-link-control:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build GatewayLink control host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Imain \
            tests/host/test_gateway_link_control.c \
            main/gateway_link_control.c \
            main/gateway_link_protocol.c \
            -lm \
            -o /tmp/test_gateway_link_control
      - name: Run GatewayLink control host tests
        run: /tmp/test_gateway_link_control

  host-reporting-policy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build reporting policy host tests
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic \
            -Imain \
            tests/host/test_gateway_reporting_policy.c \
            main/gateway_reporting_policy.c \
            -o /tmp/test_gateway_reporting_policy
      - name: Run reporting policy host tests
        run: /tmp/test_gateway_reporting_policy

  firmware:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: espressif/esp-idf-ci-action@v1
        with:
          esp_idf_version: v5.5.4
          target: esp32c6
          command: idf.py build
